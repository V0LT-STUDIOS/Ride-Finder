name: Import RideFinder website
on:
  push:
    paths:
      - ".github/workflows/import-ridefinder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Unpack RideFinder source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, lzma, tarfile, shutil, tempfile
          root = Path('.')
          chunks = [Path(f'import-payload/part{i:02d}.txt').read_text().strip() for i in range(8)]
          archive = lzma.decompress(base64.b64decode(''.join(chunks), validate=True))
          with tempfile.TemporaryDirectory() as temp:
              tempdir = Path(temp)
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as tar:
                  members = tar.getmembers()
                  for member in members:
                      path = Path(member.name)
                      if path.parts[0] != 'ridefinder-github' or path.is_absolute() or '..' in path.parts:
                          raise ValueError('Unexpected path: ' + member.name)
                      if not (member.isfile() or member.isdir()):
                          raise ValueError('Unexpected archive entry: ' + member.name)
                  tar.extractall(tempdir, filter='data')
              source = tempdir / 'ridefinder-github'
              for file in source.rglob('*'):
                  if not file.is_file():
                      continue
                  target = root / file.relative_to(source)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(file, target)
          shutil.rmtree('import-payload')
          PY

      - name: Commit the website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add complete RideFinder website source"
          git push
